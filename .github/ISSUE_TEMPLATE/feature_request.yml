name: Feature request / 기능 제안
description: Suggest a technique, mood preset, format, provider or workflow change. / 기법·무드·규격·서비스·작업 순서 제안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 해결하려는 문제
      description: What can't you make today, or what takes too long? / 지금 만들 수 없거나 오래 걸리는 것은 무엇인가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 제안
      description: What should the skill do? Reference videos or frames help. / 스킬이 무엇을 해야 하나요? 참고 영상이나 프레임이 있으면 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 검토한 다른 방법
